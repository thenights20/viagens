<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Stock Monitor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;flex-direction:column}.top{height:70px;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#0b1728;border-bottom:1px solid #20324b}.brand{font-size:19px;font-weight:900}.sub{font-size:12px;color:#9db0c9}.spacer{flex:1}.interval,.storage{display:flex;align-items:center;gap:6px;font-size:12px;color:#9db0c9}.interval input{width:62px;background:#101c2e;color:#fff;border:1px solid #2a405e;border-radius:7px;padding:8px;font-weight:800}.storage select{background:#101c2e;color:#fff;border:1px solid #2a405e;border-radius:7px;padding:8px;font-weight:800}.soundbox{display:flex;align-items:center;gap:6px;font-size:12px;color:#9db0c9}.soundbox input{width:105px}.vol{min-width:38px;color:#fff;font-weight:800}.test,.start,.stop{border:0;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}.test{background:#243b5a;color:#fff}.start{background:#65a5ff;color:#07111f}.stop{background:#40202b;color:#ff9aaa}.grid{height:calc(100% - 210px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.card{min-width:0;background:#0d1726;border:1px solid #263b58;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}.head{padding:10px 12px;border-bottom:1px solid #263b58;font-weight:900;display:flex;justify-content:space-between;align-items:center}.state{font-size:11px;color:#9db0c9}.card iframe{border:0;width:100%;height:100%;background:#07111f}.history{height:140px;margin:0 8px 8px;background:#0d1726;border:1px solid #263b58;border-radius:10px;overflow:hidden}.historyHead{height:38px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #263b58;font-weight:900}.historyList{height:101px;overflow:auto;display:flex;gap:7px;align-content:flex-start;flex-wrap:wrap;padding:8px}.hit{background:#101c2e;border:1px solid #2a405e;border-radius:7px;padding:6px 9px;font-size:12px}.empty{color:#8295ad;font-size:12px;padding:4px}
</style></head><body>
<div class="top"><div><div class="brand" id="brand">🍎 Monitor Apple · iPhone 18 Pro Max Burgundy 256GB + 512GB</div><div class="sub">Miami · Tampa · Orlando · Cape Canaveral</div></div><div class="spacer"></div><label class="storage">Capacidade <select id="storageSelect"><option value="256GB,512GB" selected>256GB + 512GB</option><option value="256GB">256GB</option><option value="512GB">512GB</option></select></label><label class="soundbox">🔊 <input id="volume" type="range" min="10" max="100" step="5" value="100"><span class="vol" id="volText">100%</span></label><button class="test" id="testSound">🔔 Testar som</button><label class="interval">Intervalo <input id="secs" type="number" min="1" max="300" value="15"> s</label><button class="start" id="start">▶ Iniciar 4 locais</button><button class="stop" id="stop">■ Parar</button></div>
<div class="grid"><div class="card"><div class="head">Miami <span class="state">monitor dedicado</span></div><iframe data-region="miami" src="https://thenights20.github.io/viagens/?appleRegion=miami&embedded=1"></iframe></div><div class="card"><div class="head">Tampa <span class="state">monitor dedicado</span></div><iframe data-region="tampa" src="https://thenights20.github.io/viagens/?appleRegion=tampa&embedded=1"></iframe></div><div class="card"><div class="head">Orlando <span class="state">monitor dedicado</span></div><iframe data-region="orlando" src="https://thenights20.github.io/viagens/?appleRegion=orlando&embedded=1"></iframe></div><div class="card"><div class="head">Cape Canaveral <span class="state">monitor dedicado</span></div><iframe data-region="cape" src="https://thenights20.github.io/viagens/?appleRegion=cape&embedded=1"></iframe></div></div>
<div class="history"><div class="historyHead">🕘 Histórico de disponibilidade · data + horário + região + loja</div><div class="historyList" id="history"></div></div>
<script>
const frames=[...document.querySelectorAll('iframe')],secs=document.getElementById('secs'),hist=document.getElementById('history'),volume=document.getElementById('volume'),volText=document.getElementById('volText'),storageSelect=document.getElementById('storageSelect'),brand=document.getElementById('brand');
const HKEY='appleStockFindHistoryV1',DKEY='appleStockRegionalDelayMsV1',VKEY='appleStockAlertVolumeV1',SKEY='appleStockStoragesV1';let lastHist='',running=false;
function loadPrefs(){secs.value=String(Math.max(1,Math.round((Number(localStorage.getItem(DKEY))||15000)/1000)));volume.value=localStorage.getItem(VKEY)||'100';volText.textContent=volume.value+'%';storageSelect.value=localStorage.getItem(SKEY)||'256GB,512GB';updateBrand()}
function loadHistory(){try{const a=JSON.parse(localStorage.getItem(HKEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function saveHistory(a){try{localStorage.setItem(HKEY,JSON.stringify(a.slice(0,240)))}catch{}}
function alarm(){const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),gain=ctx.createGain();gain.gain.value=Number(volume.value)/100;gain.connect(ctx.destination);const now=ctx.currentTime;[0,.32,.64,1.05,1.37,1.69].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i<3?'square':'sawtooth';o.frequency.value=i<3?880:1175;g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.9,now+t+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t+.25);o.connect(g);g.connect(gain);o.start(now+t);o.stop(now+t+.28)});setTimeout(()=>ctx.close(),2400)}
function fmtDateTime(v){const n=Date.parse(v||'');if(!Number.isFinite(n))return String(v||'');return new Date(n).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function rowKey(x){return [String(x.store_number||x.store||x.name||x.location||'').trim().toLowerCase(),String(x.storage||'').toUpperCase()].join('|')}
function normalizeRow(x={}){return{ts:x.ts||x.time||x.date||x.at||x.timestamp||'',region:x.region||x.search_area||'',store:x.store||x.location||x.name||'Apple Store',store_number:x.store_number||'',address:x.address||'',city:x.city||'',state:x.state||'',postal_code:x.postal_code||'',storage:x.storage||''}}
function expandHistory(a){const rows=[];a.forEach(x=>{if(Array.isArray(x?.stores)){const regs=Array.isArray(x.regions)?x.regions:[];x.stores.forEach(name=>rows.push(normalizeRow({ts:x.ts||x.time||x.date||'',region:regs.join(' / ')||x.region||'',store:String(name||'Apple Store')})))}else rows.push(normalizeRow(x||{}))});return rows}
function dedupeRows(rows){const out=[];rows.sort((a,b)=>(Date.parse(b.ts||0)||0)-(Date.parse(a.ts||0)||0)).forEach(item=>{const k=rowKey(item),t=Date.parse(item.ts||'');const dup=out.some(x=>rowKey(x)===k&&Number.isFinite(t)&&Number.isFinite(Date.parse(x.ts||''))&&Math.abs(t-Date.parse(x.ts||''))<120000);if(!dup)out.push(item)});return out.slice(0,240)}
function renderHistory(){const rows=dedupeRows(expandHistory(loadHistory()));const sig=JSON.stringify(rows.slice(0,3));if(lastHist&&sig!==lastHist&&rows.length)alarm();lastHist=sig;hist.innerHTML='';if(!rows.length){hist.innerHTML='<div class="empty">Nenhuma disponibilidade registrada ainda.</div>';return}rows.slice(0,120).forEach(x=>{const d=document.createElement('div');d.className='hit';const dt=fmtDateTime(x.ts);let store=String(x.store||'Apple Store');if(store&&!/^Apple\b/i.test(store))store='Apple '+store;d.textContent=[dt,x.region,store,x.storage,x.city].filter(Boolean).join(' · ');d.title=[x.address,[x.city,x.state,x.postal_code].filter(Boolean).join(' ')].filter(Boolean).join(' · ');hist.appendChild(d)})}
function addRows(rows,{silent=false}={}){if(!Array.isArray(rows)||!rows.length)return;const before=dedupeRows(expandHistory(loadHistory()));const merged=dedupeRows([...rows.map(normalizeRow),...before]);if(JSON.stringify(merged)===JSON.stringify(before))return;saveHistory(merged);if(silent)lastHist=JSON.stringify(merged.slice(0,3));renderHistory()}
function acceptFinding(data){if(!data||data.type!=='apple-stock-found'||!Array.isArray(data.stores)||!data.stores.length)return;const ts=Date.parse(data.ts||'')?new Date(data.ts).toISOString():new Date().toISOString();const region=String(data.region||'');addRows(data.stores.map(s=>({ts,region:region||String(s.search_area||''),store:String(s.name||'Apple Store'),store_number:String(s.store_number||''),address:String(s.address||''),city:String(s.city||''),state:String(s.state||''),postal_code:String(s.postal_code||''),storage:String(s.storage||'')})),{silent:true})}
function acceptSnapshot(data){if(!data||data.type!=='apple-history-snapshot'||!Array.isArray(data.history)||!data.history.length)return;const rows=[];data.history.forEach(item=>{const ts=item.ts||item.time||item.date||'';const regs=Array.isArray(item.regions)&&item.regions.length?item.regions:[data.region||item.region||''];const region=regs.filter(Boolean).join(' / ');if(Array.isArray(item.stores)){item.stores.forEach(name=>rows.push({ts,region,store:String(name||'Apple Store')}))}else rows.push(normalizeRow({...item,region:region||item.region||''}))});addRows(rows,{silent:true})}
function updateBrand(){brand.textContent='🍎 Monitor Apple · iPhone 18 Pro Max Burgundy '+storageSelect.value.replace(',', ' + ')}
function url(region,run,delay){return `https://thenights20.github.io/viagens/?appleRegion=${region}&embedded=1&autostart=${run?1:0}&startDelay=${delay}&storages=${encodeURIComponent(storageSelect.value)}`}
function startAll(){running=true;[0,1200,2400,3600].forEach((d,i)=>frames[i].src=url(frames[i].dataset.region,true,d))}function stopAll(){running=false;frames.forEach(f=>f.src=url(f.dataset.region,false,0))}
window.addEventListener('message',e=>{if(e.origin!=='https://thenights20.github.io')return;if(!frames.some(f=>f.contentWindow===e.source))return;if(e.data?.type==='apple-stock-found')acceptFinding(e.data);else if(e.data?.type==='apple-history-snapshot')acceptSnapshot(e.data)});
secs.oninput=()=>{const n=Math.max(1,Math.min(300,Number(secs.value)||15));localStorage.setItem(DKEY,String(Math.round(n*1000)))};volume.oninput=()=>{localStorage.setItem(VKEY,volume.value);volText.textContent=volume.value+'%'};storageSelect.onchange=()=>{localStorage.setItem(SKEY,storageSelect.value);updateBrand();if(running)startAll()};document.getElementById('testSound').onclick=alarm;document.getElementById('start').onclick=startAll;document.getElementById('stop').onclick=stopAll;setInterval(renderHistory,1500);loadPrefs();renderHistory();
</script></body></html>
