<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viagens Desktop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#bar{height:48px;display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0b1728;border-bottom:1px solid #20324b}
.brand{font-weight:900;margin-right:8px}.tab{border:1px solid #263b58;background:#111f33;color:#b9c9dc;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:750}.tab.active{background:#4ea8ff;color:#06101c;border-color:#4ea8ff}.spacer{flex:1}.status{font-size:11px;color:#7fe0ad;font-weight:700}.btn{border:1px solid #263b58;background:#111f33;color:#eef6ff;border-radius:8px;padding:7px 10px;cursor:pointer}
#stage{position:relative;height:calc(100% - 48px)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07111f;visibility:hidden;pointer-events:none}iframe.active{visibility:visible;pointer-events:auto}
#appleGrid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px;background:#07111f;visibility:hidden;pointer-events:none}#appleGrid.active{visibility:visible;pointer-events:auto}#appleGrid iframe{position:relative;visibility:visible;pointer-events:auto;border:1px solid #20324b;border-radius:7px}
</style>
</head>
<body>
<div id="bar"><div class="brand">✈ VIAGENS</div><button class="tab active" data-view="site">Painel completo</button><button class="tab" data-view="apple">🍎 Apple · 4 regiões</button><div class="spacer"></div><span class="status">● monitores permanecem carregados</span><button class="btn" id="reload">↻ Atualizar</button><button class="btn" id="full">Tela cheia</button></div>
<div id="stage">
  <iframe id="site" class="active" src="https://thenights20.github.io/viagens/" allow="notifications"></iframe>
  <div id="appleGrid">
    <iframe src="https://thenights20.github.io/viagens/?appleRegion=miami&autostart=1&startDelay=0" allow="notifications"></iframe>
    <iframe src="https://thenights20.github.io/viagens/?appleRegion=tampa&autostart=1&startDelay=3500" allow="notifications"></iframe>
    <iframe src="https://thenights20.github.io/viagens/?appleRegion=orlando&autostart=1&startDelay=7000" allow="notifications"></iframe>
    <iframe src="https://thenights20.github.io/viagens/?appleRegion=cape&autostart=1&startDelay=10500" allow="notifications"></iframe>
  </div>
</div>
<script>
const site=document.getElementById('site'), grid=document.getElementById('appleGrid');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));const apple=b.dataset.view==='apple';site.classList.toggle('active',!apple);grid.classList.toggle('active',apple)});
document.getElementById('reload').onclick=()=>{if(site.classList.contains('active'))site.src=site.src;else grid.querySelectorAll('iframe').forEach(f=>f.src=f.src)};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})};
</script>
</body></html>
