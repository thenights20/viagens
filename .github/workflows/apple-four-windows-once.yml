name: Apply Apple four-window regional monitor once

on:
  push:
    paths:
      - '.github/workflows/apple-four-windows-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply regional monitor
        run: |
          python tools/apple-four-windows.py
          node --check docs/apple-stock.js
      - name: Commit change
        run: |
          git config user.name "personal-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apple-stock.js
          git commit -m "feat: split Apple monitor into four regional windows"
          git push
