name: Apply Indigo timeout repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-indigo-timeout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply repair
        run: python tools/fix_indigo_timeout.py

      - name: Validate repaired files
        run: |
          node --check docs/indigo-parking.js
          node --check parking-indigo/search.mjs
          cat apps-script/Code.gs apps-script/Indigo.gs > /tmp/apps-script-bridge.js
          node --check /tmp/apps-script-bridge.js
          python -m py_compile scripts/deploy_apps_script.py
          python - <<'PY'
          from pathlib import Path
          code=Path('apps-script/Code.gs').read_text(encoding='utf-8')
          indigo=Path('apps-script/Indigo.gs').read_text(encoding='utf-8')
          ui=Path('docs/indigo-parking.js').read_text(encoding='utf-8')
          dep=Path('scripts/deploy_apps_script.py').read_text(encoding='utf-8')
          assert 'api\\/indigo\\/search' in code
          assert "Path('apps-script/Indigo.gs')" in dep
          assert '15 minutos · detalhado' not in ui
          assert 'bridgeJsonp' in ui
          assert '[30, 60]' in indigo
          print('Repair validation OK')
          PY

      - name: Commit code repair
        run: |
          git config user.name "indigo-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy_apps_script.py apps-script/Code.gs apps-script/Indigo.gs parking-indigo/search.mjs docs/indigo-parking.js docs/terabyte-live.js
          git commit -m "fix: repair Indigo dispatch and polling [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
