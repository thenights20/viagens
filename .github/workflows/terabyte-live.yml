name: Terabyte Live 5 min

on:
  workflow_dispatch:
  push:
    branches: [main, feat/terabyte-live]
    paths:
      - "price-monitor/src/price_monitor/terabyte_live.py"
      - "price-monitor/src/price_monitor/bug_rules.py"
      - "price-monitor/src/price_monitor/utils.py"
      - "price-monitor/tests/test_terabyte_live.py"
      - "price-monitor/upgrade_terabyte_dashboard.py"
      - "docs/terabyte-live.js"
      - "price-monitor/requirements.txt"
      - ".github/workflows/terabyte-live.yml"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: terabyte-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: price-monitor/requirements.txt

      - name: Dependências
        run: python -m pip install -r price-monitor/requirements.txt

      - name: Testes Terabyte
        env:
          PYTHONPATH: price-monitor/src
        run: python -m pytest -q price-monitor/tests/test_terabyte_live.py

      - name: Conectar aba ao painel
        run: python price-monitor/upgrade_terabyte_dashboard.py

      - name: Validar JavaScript
        run: node --check docs/terabyte-live.js

      - name: Varredura Terabyte Live
        env:
          PYTHONPATH: price-monitor/src
        run: python -m price_monitor.terabyte_live

      - name: Validar feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/data/terabyte-live.json').read_text(encoding='utf-8'))
          assert p.get('version') == '0.1.0'
          assert p.get('scan_interval_minutes') == 5
          assert isinstance(p.get('deals'), list)
          assert isinstance(p.get('page_health'), list)
          for row in p.get('deals', []):
              assert str(row.get('url', '')).startswith('https://www.terabyteshop.com.br/')
              assert float(row.get('price', 0)) > 0
              assert 0 <= int(row.get('score', 0)) <= 100
          print('Terabyte Live válido:', p.get('observed_this_run', 0), 'observados;', p.get('strong_count', 0), 'alertas 70+')
          PY

      - name: Persistir dados
        run: |
          git config user.name "terabyte-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/terabyte-live.js docs/data/terabyte-live.json price-monitor/data/terabyte-state.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar Terabyte Live [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Resumo
        run: |
          python - <<'PY'
          import json, os
          with open('docs/data/terabyte-live.json', encoding='utf-8') as f:
              p = json.load(f)
          lines = [
              '## ⚡ Terabyte Live',
              f"- Observados nesta rodada: {p.get('observed_this_run', 0)}",
              f"- Produtos no histórico: {p.get('tracked_products', 0)}",
              f"- Alertas 70+: {p.get('strong_count', 0)}",
              f"- Críticos 90+: {p.get('critical_count', 0)}",
              f"- Quedas rápidas >=15%: {p.get('sudden_drop_count', 0)}",
              f"- Páginas OK: {p.get('listing_pages_ok', 0)}/{p.get('listing_pages_scanned', 0)}",
              f"- Catálogo: {p.get('catalog_cursor', 0)}/{p.get('catalog_total', 0)}",
              f"- Atualizado: {p.get('generated_at', '-')}"
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY
