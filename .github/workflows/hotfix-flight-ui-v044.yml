name: Ajustar progresso da busca de passagens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tornar progresso mais frequente
        run: python scripts/tune_flight_progress.py

      - name: Validar Python
        run: python -m py_compile flight-month-search/search.py

      - name: Salvar ajuste
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-month-search/search.py
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "feat: atualizar progresso da busca com mais frequência [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
