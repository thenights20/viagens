name: Restaurar busca de passagens estável

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v044.yml'
      - 'scripts/hotfix_flight_button_v047.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restaurar transporte estável v0.5.0
        run: python scripts/hotfix_flight_button_v047.py

      - name: Validar JavaScript e rotas
        run: |
          node --check docs/flight-explorer.js
          node --check docs/flight-explorer-enhancements.js
          node --check docs/terabyte-live.js
          grep -q 'Buscar passagens · v0.5.0' docs/flight-explorer.js
          grep -q '?route=${encodeURIComponent(path)}' docs/flight-explorer.js
          grep -q 'api/progress/' docs/flight-explorer.js
          grep -q 'flight-explorer.js?v=20260912-15' docs/terabyte-live.js
          ! grep -q 'MutationObserver' docs/flight-explorer-enhancements.js
          grep -q 'getMonth()+18' docs/flight-explorer.js

      - name: Salvar correção
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js docs/terabyte-live.js
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "fix: restaurar fluxo estável da busca v0.5.0 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
