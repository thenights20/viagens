name: Hotfix flight UI v0.4.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar melhorias v0.4.5
        run: python scripts/hotfix_flight_ui_v045.py

      - name: Validar alterações
        run: |
          node --check docs/flight-explorer.js
          python -m py_compile flight-month-search/search.py
          grep -q 'v0.4.5' docs/flight-explorer.js
          grep -q 'monthViewSavedButton' docs/flight-explorer.js
          grep -q 'resultMonth' docs/flight-explorer.js

      - name: Salvar melhorias
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js docs/terabyte-live.js flight-month-search/search.py
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "feat: histórico durante busca e progresso real [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
