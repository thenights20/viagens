name: Corrigir botão e interface da busca

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v044.yml'
      - 'scripts/hotfix_flight_button_v047.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar correções v0.4.9
        run: python scripts/hotfix_flight_button_v047.py

      - name: Validar JavaScript
        run: |
          node --check docs/flight-explorer.js
          node --check docs/terabyte-live.js
          grep -q 'v0.4.9' docs/flight-explorer.js
          grep -q "api/search'" docs/flight-explorer.js
          grep -q 'flight-explorer.js?v=20260912-13' docs/terabyte-live.js
          grep -q 'getMonth()+18' docs/flight-explorer.js

      - name: Salvar correções
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js docs/terabyte-live.js
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "fix: restaurar envio da pesquisa pelo Apps Script [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
