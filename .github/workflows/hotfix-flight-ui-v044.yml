name: Instalar melhorias da busca de passagens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar melhorias
        run: python scripts/install_flight_enhancements.py

      - name: Validar JavaScript
        run: |
          node --check docs/terabyte-live.js
          node --check docs/flight-explorer-enhancements.js

      - name: Salvar melhorias
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/terabyte-live.js
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "feat: histórico acessível durante busca e progresso real [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
