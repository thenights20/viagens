name: Apple Desktop Fix Once
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Apple source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/apple-stock.js')
          s = p.read_text(encoding='utf-8')
          if 'REGIONAL_DELAY_KEY' not in s:
              s = s.replace("  const REGIONAL_QUERY_DELAY = 15000;", "  const REGIONAL_QUERY_DELAY = 15000;\n  const REGIONAL_DELAY_KEY = 'appleStockRegionalDelayMsV1';")
              s = s.replace("  const regionalMode = !!regionalPoint;", "  const regionalMode = !!regionalPoint;\n  let regionalQueryDelay = Math.max(1000, Number(localStorage.getItem(REGIONAL_DELAY_KEY)||REGIONAL_QUERY_DELAY));")
              s = s.replace("    if(regionalMode)return REGIONAL_QUERY_DELAY;", "    if(regionalMode)return regionalQueryDelay;")
          css = "\n    .apple-regional-window body>.wrap>header{display:none!important}\n    .apple-regional-window .apple-head{display:none!important}\n    .apple-regional-window #appleStockApp{padding-top:0!important;margin-top:0!important}\n    .apple-regional-window .apple-form{margin-top:0!important}\n"
          marker = "    @media(max-width:1200px){.apple-stores{grid-template-columns:repeat(3,1fr)}}"
          if '.apple-regional-window body>.wrap>header' not in s and marker in s:
              s = s.replace(marker, css + marker, 1)
          s = s.replace('gain.gain.setValueAtTime(0.12, now);', 'gain.gain.setValueAtTime(0.28, now);')
          s = s.replace('gain.gain.exponentialRampToValueAtTime(0.001, now+0.9);', 'gain.gain.exponentialRampToValueAtTime(0.001, now+1.25);')
          s = s.replace('osc.stop(now+0.95);', 'osc.stop(now+1.30);')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apple-stock.js
          git commit -m "fix: compact Apple desktop monitors and persistent interval" || exit 0
          git push
