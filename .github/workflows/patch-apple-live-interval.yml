name: Patch Apple live interval
on:
  push:
    paths: ['.github/workflows/patch-apple-live-interval.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('docs/apple-stock.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  const REGIONAL_QUERY_DELAY = 15000;", "  const REGIONAL_QUERY_DELAY = 15000;\n  const REGIONAL_DELAY_KEY = 'appleStockRegionalDelayMsV1';")
          s=s.replace("  const regionalMode = !!regionalPoint;", "  const regionalMode = !!regionalPoint;\n  let regionalQueryDelay = Math.max(1000, Number(localStorage.getItem(REGIONAL_DELAY_KEY)||REGIONAL_QUERY_DELAY));")
          s=s.replace("    if(regionalMode)return REGIONAL_QUERY_DELAY;", "    if(regionalMode)return regionalQueryDelay;")
          needle="""      <div class=\"apple-field\"><label>Intervalo</label><div class=\"apple-fixed\" id=\"appleInterval\">${regionalMode?`${Math.round(REGIONAL_QUERY_DELAY/1000)} s · fixo`:'calculando…'}</div></div>"""
          repl="""      <div class=\"apple-field\"><label>Intervalo</label>${regionalMode?`<div style=\"display:flex;gap:5px;align-items:center\"><input id=\"appleIntervalInput\" type=\"number\" min=\"1\" max=\"300\" step=\"1\" value=\"${Math.round(regionalQueryDelay/1000)}\" style=\"width:82px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:0 9px;font-weight:800\"><span class=\"sub\">segundos</span></div>`:`<div class=\"apple-fixed\" id=\"appleInterval\">calculando…</div>`}</div>"""
          if needle not in s: raise SystemExit('interval markup not found')
          s=s.replace(needle,repl)
          marker="""  const els = {
"""
          # Add live listener just before els declaration. It changes the next schedule immediately without stopping an in-flight request.
          live="""  function applyRegionalDelaySeconds(value){
    if(!regionalMode)return;
    const seconds=Math.max(1,Math.min(300,Math.round(Number(value)||15)));
    regionalQueryDelay=seconds*1000;
    try{localStorage.setItem(REGIONAL_DELAY_KEY,String(regionalQueryDelay));}catch{}
    if(timer){clearTimeout(timer);timer=null;}
    if(active)timer=setTimeout(tick,regionalQueryDelay);
  }

  const intervalInput=qs('#appleIntervalInput');
  if(intervalInput){
    const apply=()=>applyRegionalDelaySeconds(intervalInput.value);
    intervalInput.addEventListener('input',apply);
    intervalInput.addEventListener('change',apply);
    window.addEventListener('storage',e=>{
      if(e.key!==REGIONAL_DELAY_KEY)return;
      const ms=Math.max(1000,Number(e.newValue)||REGIONAL_QUERY_DELAY);
      regionalQueryDelay=ms;
      intervalInput.value=String(Math.round(ms/1000));
      if(timer){clearTimeout(timer);timer=null;}
      if(active)timer=setTimeout(tick,regionalQueryDelay);
    });
  }

"""
          if marker not in s: raise SystemExit('els marker not found')
          s=s.replace(marker,live+marker,1)
          p.write_text(s,encoding='utf-8')
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/apple-stock.js
          git commit -m 'feat: live manual Apple polling interval' || exit 0
          git push
