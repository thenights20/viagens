name: Indigo date range migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indigo-date-range-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply migration
        run: python tools/indigo_date_range_migration.py

      - name: Validate JavaScript
        run: |
          node --check docs/indigo-parking.js
          node --check docs/terabyte-live.js
          node --check parking-indigo/search.mjs

      - name: Commit changes
        run: |
          git config user.name "indigo-date-range-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/indigo-parking.js docs/terabyte-live.js parking-indigo/search.mjs apps-script/Indigo.gs
          git commit -m "feat: search Indigo across date ranges [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
