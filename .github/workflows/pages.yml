name: Publicar página pessoal

on:
  workflow_dispatch:
  public:
  push:
    branches: [main]
    paths:
      - "price-monitor/site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: price-monitor/site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
