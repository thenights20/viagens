name: Apply flight resume patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flight-resume-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_flight_resume_patch.py
      - name: Validate
        run: |
          python -m py_compile flight-month-search/search.py flight-month-search/multisource.py flight-month-search/resume_cache.py
          node --check docs/flight-explorer.js
          node --check docs/terabyte-live.js
          python - <<'PY'
          from pathlib import Path
          m=Path('flight-month-search/multisource.py').read_text(encoding='utf-8')
          u=Path('docs/flight-explorer.js').read_text(encoding='utf-8')
          assert 'FlightResumeCache' in m
          assert 'pending_combos' in m
          assert 'reused_combinations' in m
          assert "stage==='multisource'" in u
          print('Resume patch validation OK')
          PY
      - name: Commit code changes
        run: |
          git config user.name "flight-resume-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-month-search/multisource.py docs/flight-explorer.js docs/terabyte-live.js
          git commit -m "feat: resume flight searches within one hour [skip ci]"
          git restore .github/workflows/flight-month-search.yml 2>/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
