name: Hotfix flight UI v0.4.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-flight-ui-v045.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Melhorar histórico durante busca e progresso real
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/flight-explorer.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Buscar passagens · v0.4.4', 'Buscar passagens · v0.4.5')

          old = '<div class="month-progress-head"><div class="month-progress-title"><b id="monthProgressStage">Preparando pesquisa…</b><strong id="monthProgressPct">0%</strong></div><button class="month-stop-btn" id="monthStopButton">■ Parar pesquisa</button></div>'
          new = '<div class="month-progress-head"><div class="month-progress-title"><b id="monthProgressStage">Preparando pesquisa…</b><strong id="monthProgressPct">0%</strong></div><div class="month-progress-actions"><button class="month-saved-btn" id="monthViewSavedButton">📚 Ver buscas salvas</button><button class="month-saved-btn" id="monthViewCurrentButton" hidden>🔎 Voltar à busca atual</button><button class="month-stop-btn" id="monthStopButton">■ Parar pesquisa</button></div></div>'
          if old not in s:
              raise SystemExit('Cabeçalho de progresso não encontrado')
          s = s.replace(old, new, 1)

          old = '<div><label for="resultDestination">Filtrar destino</label><select id="resultDestination"><option value="">Todos os destinos</option></select></div>\n      <div><label for="resultSort">Ordenar por</label><select id="resultSort"><option value="price_asc">Menor preço primeiro</option><option value="price_desc">Maior preço primeiro</option><option value="date_asc">Data de ida</option></select></div>'
          new = '<div><label for="resultDestination">Filtrar destino</label><select id="resultDestination"><option value="">Todos os destinos</option></select></div>\n      <div><label for="resultMonth">Mês</label><select id="resultMonth"><option value="">Todos os meses</option></select></div>\n      <div><label for="resultSort">Ordenar por</label><select id="resultSort"><option value="price_asc">Menor preço primeiro</option><option value="price_desc">Maior preço primeiro</option><option value="date_asc">Data de ida</option></select></div>'
          if old not in s:
              raise SystemExit('Filtros de resultados não encontrados')
          s = s.replace(old, new, 1)

          css_anchor = '.month-stop-btn{border:1px solid rgba(255,104,116,.5);background:rgba(255,104,116,.08);color:var(--hot);font-weight:900;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:11px;white-space:nowrap}.month-stop-btn:hover{background:rgba(255,104,116,.16)}.month-stop-btn:disabled{opacity:.55;cursor:wait}'
          css_new = css_anchor + '.month-progress-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.month-saved-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:11px;white-space:nowrap}.month-saved-btn:hover{border-color:var(--accent);color:var(--accent)}'
          if css_anchor not in s:
              raise SystemExit('CSS do botão parar não encontrado')
          s = s.replace(css_anchor, css_new, 1)

          old_filter = "function filterRows(rows,origin,destination,sort){\n    return rows.filter(x=>(!origin||x.origin===origin)&&(!destination||x.destination===destination)).sort((a,b)=>sort==='date_asc'?a.departure_date.localeCompare(b.departure_date)||Number(a.price)-Number(b.price):sort==='price_desc'?Number(b.price)-Number(a.price):Number(a.price)-Number(b.price));\n  }"
          new_filter = "function filterRows(rows,origin,destination,sort,month){\n    return rows.filter(x=>(!origin||x.origin===origin)&&(!destination||x.destination===destination)&&(!month||String(x.departure_date||'').slice(0,7)===month)).sort((a,b)=>sort==='date_asc'?a.departure_date.localeCompare(b.departure_date)||Number(a.price)-Number(b.price):sort==='price_desc'?Number(b.price)-Number(a.price):Number(a.price)-Number(b.price));\n  }"
          if old_filter not in s:
              raise SystemExit('filterRows não encontrado')
          s = s.replace(old_filter, new_filter, 1)

          marker = "  function calendarRows(rows){"
          insert = "  function monthLabel(key){if(!/^\\d{4}-\\d{2}$/.test(key||''))return key||'';const[y,m]=key.split('-').map(Number);const text=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(y,m-1,1));return text.charAt(0).toUpperCase()+text.slice(1);}\n  function resultMonthOptions(rows){const el=q('#resultMonth'),selected=el.value,months=[...new Set(rows.map(x=>String(x.departure_date||'').slice(0,7)).filter(x=>/^\\d{4}-\\d{2}$/.test(x)))].sort();el.innerHTML='<option value=\"\">Todos os meses</option>'+months.map(m=>`<option value=\"${esc(m)}\">${esc(monthLabel(m))}</option>`).join('');el.value=months.includes(selected)?selected:'';}\n"
          if marker not in s:
              raise SystemExit('calendarRows não encontrado')
          s = s.replace(marker, insert + marker, 1)

          old_render = "    const available=availableRows();resultOptions(available);\n    const filtered=filterRows(available,q('#resultOrigin').value,q('#resultDestination').value,q('#resultSort').value),rows=filtered.slice(0,100),stats=data.stats||{},req=data.request||{},hist=data.history_summary||{};"
          new_render = "    const available=availableRows();resultOptions(available);resultMonthOptions(available);const viewingSaved=q('#resultScope').value==='all';q('#monthViewSavedButton').hidden=viewingSaved;q('#monthViewCurrentButton').hidden=!viewingSaved;\n    const filtered=filterRows(available,q('#resultOrigin').value,q('#resultDestination').value,q('#resultSort').value,q('#resultMonth').value),rows=filtered.slice(0,100),stats=data.stats||{},req=data.request||{},hist=data.history_summary||{};"
          if old_render not in s:
              raise SystemExit('Início de render não encontrado')
          s = s.replace(old_render, new_render, 1)

          s = s.replace("function showProgress(total){q('#monthProgress').hidden=false;q('#monthStopButton').disabled=false;updateProgress({pct:1,stage:'Enviando solicitação…'", "function showProgress(total){q('#monthProgress').hidden=false;q('#monthStopButton').disabled=false;updateProgress({pct:0,stage:'Enviando solicitação…'", 1)

          pat = re.compile(r"  function liveProgress\(live,elapsed\)\{.*?\n  \}\n\n  async function fetchRunState", re.S)
          repl = '''  function liveProgress(live,elapsed){
    const s=live.stats||{},stage=live.stage||'starting',total=Number(s.combinations||0),primary=Number(s.primary_completed??s.processed_combinations??0),primaryTotal=Number(s.primary_total||total),fb=Number(s.fallback_done||0),fbTotal=Number(s.fallback_total||0),priced=Number(s.priced_combinations||0);
    let pct=0,label='Preparando pesquisa…',done=Math.min(primary,total),remaining=Math.max(0,total-done),detail='aguardando primeiro resultado';
    if(stage==='google'){
      pct=primaryTotal?primary/primaryTotal*100:0;label=`Google Flights · ${primary}/${primaryTotal}`;remaining=Math.max(0,primaryTotal-primary);detail=live.current_pair?`consultando ${fmtDate(live.current_pair.departure_date)} → ${fmtDate(live.current_pair.return_date)} · ✓ salvo`:'✓ achados salvos';
    }else if(stage==='fallback'){
      pct=fbTotal?fb/fbTotal*100:0;label=`Confirmação adicional · ${fb}/${fbTotal}`;done=total;remaining=Math.max(0,fbTotal-fb);detail=`etapa 2/2 · ${priced} com preço · ✓ salvo`;
    }else if(stage==='completed'){
      pct=100;label='Pesquisa concluída';done=total;remaining=0;detail='✓ resultado e histórico salvos';
    }else if(stage==='interrupted'){
      pct=primaryTotal?primary/primaryTotal*100:0;label='Pesquisa interrompida — parcial preservado';remaining=Math.max(0,total-done);detail='✓ resultados parciais salvos';
    }
    return{pct,stage:label,done,total,priced,remaining,elapsed,detail};
  }

  async function fetchRunState'''
          s2, n = pat.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit('liveProgress não encontrado')
          s = s2

          s = s.replace("if(run.status==='queued')return{pct:3,stage:'Aguardando executor do GitHub…'", "if(run.status==='queued')return{pct:0,stage:'Na fila do GitHub Actions…'", 1)
          s = s.replace("if(run.conclusion==='success')return{pct:98,stage:'Finalizando resultado…'", "if(run.conclusion==='success')return{pct:100,stage:'Execução concluída · carregando resultado…'", 1)
          old_tail = "return{pct:name==='Pesquisar matriz completa do período'?15:8,stage:name==='Dependências'?'Preparando motor de pesquisa…':'Preparando pesquisa…',done:0,total,priced:0,detail:name,run};"
          new_tail = "return{pct:0,stage:name==='Pesquisar matriz completa do período'?'Motor iniciado · aguardando primeiro lote…':name==='Dependências'?'Preparando motor de pesquisa…':'Preparando pesquisa…',done:0,total,priced:0,detail:name,run};"
          if old_tail not in s:
              raise SystemExit('Estado do workflow não encontrado')
          s = s.replace(old_tail, new_tail, 1)

          s = s.replace("state={pct:Number(bridge.percent||3),stage:bs==='queued'?'Pesquisa recebida pelo serviço…':bs==='completed'||bs==='done'?'Finalizando resultado…':'Pesquisa confirmada pelo serviço…'", "state={pct:(bs==='completed'||bs==='done')?100:0,stage:bs==='queued'?'Pesquisa recebida pelo serviço…':bs==='completed'||bs==='done'?'Finalizando resultado…':'Pesquisa confirmada pelo serviço…'", 1)
          s = s.replace("updateProgress({pct:2,stage:'Aguardando confirmação do serviço…'", "updateProgress({pct:0,stage:'Aguardando confirmação do serviço…'", 1)

          old_events = "for(const id of ['#resultScope','#resultOrigin','#resultDestination','#resultSort'])q(id).addEventListener('change',()=>{render();if(id==='#resultScope'&&q(id).value==='all')loadSavedPairs().then(render)});"
          new_events = "for(const id of ['#resultScope','#resultOrigin','#resultDestination','#resultMonth','#resultSort'])q(id).addEventListener('change',()=>{render();if(id==='#resultScope'&&q(id).value==='all')loadSavedPairs().then(render)});"
          if old_events not in s:
              raise SystemExit('Eventos de filtro não encontrados')
          s = s.replace(old_events, new_events, 1)

          event_anchor = "  q('#monthSearchButton').addEventListener('click',searchInsidePage);q('#monthStopButton').addEventListener('click',stopSearch);"
          event_new = "  q('#monthViewSavedButton').addEventListener('click',async()=>{q('#resultScope').value='all';await loadSavedPairs();render();q('#resultCaption').scrollIntoView({behavior:'smooth',block:'center'});});q('#monthViewCurrentButton').addEventListener('click',()=>{q('#resultScope').value='current';q('#resultMonth').value='';render();q('#resultCaption').scrollIntoView({behavior:'smooth',block:'center'});});\n  q('#monthSearchButton').addEventListener('click',searchInsidePage);q('#monthStopButton').addEventListener('click',stopSearch);"
          if event_anchor not in s:
              raise SystemExit('Eventos principais não encontrados')
          s = s.replace(event_anchor, event_new, 1)

          p.write_text(s, encoding='utf-8')

          py = Path('flight-month-search/search.py')
          x = py.read_text(encoding='utf-8')
          x = x.replace('CHECKPOINT_SECONDS = 18', 'CHECKPOINT_SECONDS = 8', 1)
          x = x.replace('CHECKPOINT_COMPLETIONS = 24', 'CHECKPOINT_COMPLETIONS = 12', 1)
          py.write_text(x, encoding='utf-8')

          loader = Path('docs/terabyte-live.js')
          t = loader.read_text(encoding='utf-8')
          t = t.replace("./flight-explorer.js?v=20260912-6", "./flight-explorer.js?v=20260912-7")
          loader.write_text(t, encoding='utf-8')
          PY
      - name: Validar alterações
        run: |
          node --check docs/flight-explorer.js
          python -m py_compile flight-month-search/search.py
          grep -q 'v0.4.5' docs/flight-explorer.js
          grep -q 'monthViewSavedButton' docs/flight-explorer.js
          grep -q 'resultMonth' docs/flight-explorer.js
      - name: Salvar melhorias
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js docs/terabyte-live.js flight-month-search/search.py
          git commit -m "feat: consultar histórico durante busca e mostrar progresso real [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
