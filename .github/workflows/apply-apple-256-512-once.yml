name: Apply Apple 256GB + 512GB monitor update once

on:
  push:
    paths:
      - 'tools/add-apple-512-monitor.py'
      - '.github/workflows/apply-apple-256-512-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python tools/add-apple-512-monitor.py
      - name: Validate JavaScript
        run: |
          cat apps-script/*.gs > /tmp/apps-script-all.js
          node --check /tmp/apps-script-all.js
          node --check docs/apple-stock.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('desktop/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',h,re.S)
          assert m
          Path('/tmp/desktop.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/desktop.js
          grep -q "MJWA4LL/A" apps-script/Apple.gs
          grep -q "256GB + 512GB" desktop/index.html
      - name: Commit update
        run: |
          git config user.name "personal-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Apple.gs docs/apple-stock.js desktop/index.html desktop/package.json
          git commit -m "feat: monitor iPhone 18 Pro Max Burgundy 256GB and 512GB"
          git push
