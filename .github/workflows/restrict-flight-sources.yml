name: Restrict flight fare sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restrict-flight-sources.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restrict sources and clean contaminated fares
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          p = Path('flight-month-search/multisource.py')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'SOURCE_CATALOG = \{.*?\}\n\nAUTO_CANDIDATES = \[.*?\]\n',
              '''SOURCE_CATALOG = {
    "google": {"label": "Google Flights", "auto_candidate": True},
    "ita": {"label": "ITA Matrix", "auto_candidate": False},
}

AUTO_CANDIDATES = []
''',
              s,
              count=1,
              flags=re.S,
          )

          s = re.sub(
              r'URL_BUILDERS = \{.*?\}\n\n\ndef search_links',
              '''URL_BUILDERS = {
    "google": google_url,
    "ita": ita_url,
}


def search_links''',
              s,
              count=1,
              flags=re.S,
          )

          s = re.sub(
              r'def preflight_sources\(.*?\n\s*return enabled, health\n\n\ndef query_one',
              '''def preflight_sources(
    origin: str,
    destination: str,
    dep: date,
    ret: date,
    max_stops: int,
) -> tuple[list[str], dict[str, dict]]:
    """Only Google Flights may create automatic fare rows.

    ITA Matrix remains available as a route/date verification link. We do not
    parse generic HTML from travel agencies because those pages can expose
    unrelated promotional numbers that look like fares.
    """
    health = {
        "google": {
            "enabled": True,
            "label": SOURCE_CATALOG["google"]["label"],
            "reason": "structured fare collector",
        },
        "ita": {
            "enabled": False,
            "label": SOURCE_CATALOG["ita"]["label"],
            "reason": "verification/search link only; no stable public fare API",
        },
    }
    return ["google"], health


def query_one''',
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace('payload["source_strategy"] = "preflight_sharded"', 'payload["source_strategy"] = "google_flights_with_ita_verification"')
          s = s.replace('"live: iniciar busca multifonte', '"live: iniciar busca Google+ITA')
          s = s.replace('"live: concluir busca multifonte', '"live: concluir busca Google+ITA')
          s = s.replace('"live: parcial multifonte', '"live: parcial Google+ITA')
          s = s.replace('f"Busca multifonte {request_id}', 'f"Busca Google+ITA {request_id}')
          p.write_text(s, encoding='utf-8')

          allowed = {'google', 'fast-flights', 'Google Flights', 'google flights'}
          def good_row(row):
              vals = {
                  str(row.get('source_kind') or '').strip(),
                  str(row.get('provider') or '').strip(),
                  str(row.get('airline') or '').strip(),
              }
              return bool(vals & allowed)

          result_path = Path('docs/data/flight-month-search.json')
          if result_path.exists():
              data = json.loads(result_path.read_text(encoding='utf-8'))
              for key in ('results', 'all_results', 'daily_min'):
                  if isinstance(data.get(key), list):
                      data[key] = [r for r in data[key] if isinstance(r, dict) and good_row(r)]
              rows = data.get('all_results') or data.get('results') or []
              stats = data.setdefault('stats', {})
              stats['priced_combinations'] = len(rows)
              stats['result_count'] = min(100, len(data.get('results') or []))
              prices = [float(r['price']) for r in rows if r.get('price') is not None]
              stats['lowest_price'] = min(prices) if prices else None
              total = int(stats.get('combinations') or 0)
              stats['coverage_pct'] = round(len(rows) / total * 100, 1) if total else 0
              data['sources'] = SOURCE_CATALOG = {
                  'google': {'label': 'Google Flights', 'auto_candidate': True},
                  'ita': {'label': 'ITA Matrix', 'auto_candidate': False},
              }
              data['active_sources'] = ['google']
              data['source_strategy'] = 'google_flights_with_ita_verification'
              result_path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          hist_path = Path('docs/data/flight-price-history.json')
          if hist_path.exists():
              hist = json.loads(hist_path.read_text(encoding='utf-8'))
              pairs = hist.get('pairs') if isinstance(hist, dict) else None
              if isinstance(pairs, dict):
                  clean = {}
                  for key, pair in pairs.items():
                      obs = pair.get('observations') or []
                      sources = {str(o.get('source') or '').strip() for o in obs if isinstance(o, dict)}
                      if not sources or sources <= allowed:
                          clean[key] = pair
                  hist['pairs'] = clean
                  hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2), encoding='utf-8')

          print('Sources restricted to Google Flights + ITA Matrix; contaminated rows removed.')
          PY

      - name: Validate Python
        run: python -m py_compile flight-month-search/multisource.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-month-search/multisource.py docs/data/flight-month-search.json docs/data/flight-price-history.json
          git commit -m "fix: use only Google Flights and ITA for fare search [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
