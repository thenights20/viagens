name: Restrict flight fare sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restrict-flight-sources.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restrict sources and clean contaminated fares
        run: python tools/restrict_flight_sources.py

      - name: Validate Python
        run: python -m py_compile flight-month-search/multisource.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-month-search/multisource.py docs/data/flight-month-search.json docs/data/flight-price-history.json
          git commit -m "fix: use only Google Flights and ITA for fare search [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
