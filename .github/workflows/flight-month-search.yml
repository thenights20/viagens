name: Busca de passagens sob demanda
run-name: "Busca ${{ inputs.request_id }} · ${{ inputs.origin }} → ${{ inputs.destination }} · ${{ inputs.period_mode == 'range' && format('{0}→{1}', inputs.start_date, inputs.end_date) || inputs.month }}"

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origem (IATA)"
        required: true
        default: "GRU"
        type: string
      destination:
        description: "Destino (IATA)"
        required: true
        default: "MIA"
        type: string
      month:
        description: "Mês base (YYYY-MM)"
        required: true
        default: "2026-10"
        type: string
      period_mode:
        description: "Tipo de período"
        required: false
        default: "month"
        type: choice
        options: ["month", "range"]
      start_date:
        description: "Data inicial para intervalo (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      end_date:
        description: "Data final para intervalo (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      max_stops:
        description: "Máximo de escalas"
        required: true
        default: "2"
        type: choice
        options: ["0", "1", "2"]
      request_id:
        description: "ID da solicitação do Pages/Apps Script"
        required: false
        default: "manual"
        type: string

concurrency:
  group: ${{ startsWith(inputs.request_id, 'park_') && 'indigo-parking-live' || 'flight-search-live' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar solicitação
        env:
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_PERIOD_MODE: ${{ inputs.period_mode }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
          INPUT_STOPS: ${{ inputs.max_stops }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import date

          origin=os.environ['INPUT_ORIGIN'].strip().upper()
          dest=os.environ['INPUT_DESTINATION'].strip().upper()
          month=os.environ['INPUT_MONTH'].strip()
          period_mode=(os.environ.get('INPUT_PERIOD_MODE') or 'month').strip().lower()
          start_date=(os.environ.get('INPUT_START_DATE') or '').strip()
          end_date=(os.environ.get('INPUT_END_DATE') or '').strip()
          stops=int(os.environ['INPUT_STOPS'])
          request_id=(os.environ.get('INPUT_REQUEST_ID') or 'manual').strip()[:80]

          cancel_only = origin == 'QZZ' and dest == 'QZX'
          parking_match = re.fullmatch(r'park_(\d{4})_(\d{4})_(\d{4})_(\d{4})_(30|60|120)_(t3|all)_([A-Za-z0-9]+)', request_id)
          parking_only = origin == 'GRU' and dest == 'PKG' and parking_match is not None
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"SEARCH_CANCEL_ONLY={'1' if cancel_only else '0'}\n")
              f.write(f"SEARCH_PARKING_ONLY={'1' if parking_only else '0'}\n")
          if cancel_only:
              print('Cancelamento solicitado pelo painel. A execução anterior foi encerrada pelo concurrency.')
              raise SystemExit(0)

          if not re.fullmatch(r'[A-Z]{3}',origin) or not re.fullmatch(r'[A-Z]{3}',dest): raise SystemExit('IATA inválido')
          if not re.fullmatch(r'20\d\d-(0[1-9]|1[0-2])',month): raise SystemExit('Mês inválido')
          if period_mode not in {'month','range'}: raise SystemExit('Modo de período inválido')
          if period_mode == 'range':
              try:
                  start = date.fromisoformat(start_date)
                  end = date.fromisoformat(end_date)
              except ValueError as exc:
                  raise SystemExit('Datas do intervalo inválidas') from exc
              if end <= start: raise SystemExit('A data final precisa ser posterior à data inicial')
              month = start_date[:7]
          else:
              start_date = ''
              end_date = ''
          if stops not in (0,1,2): raise SystemExit('Escalas inválidas')
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,80}',request_id): raise SystemExit('request_id inválido')

          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(
                  f'SEARCH_ORIGIN={origin}\nSEARCH_DESTINATION={dest}\nSEARCH_MONTH={month}\n'
                  f'SEARCH_PERIOD_MODE={period_mode}\nSEARCH_START_DATE={start_date}\nSEARCH_END_DATE={end_date}\n'
                  f'SEARCH_MAX_STOPS={stops}\nSEARCH_REQUEST_ID={request_id}\n'
              )
              if parking_only:
                  entry_from,entry_to,exit_from,exit_to,step,mode,_ = parking_match.groups()
                  hhmm=lambda v:v[:2]+':'+v[2:]
                  f.write(
                      f'INDIGO_REQUEST_ID={request_id}\nINDIGO_ENTRY_DATE={start_date}\nINDIGO_EXIT_DATE={end_date}\n'
                      f'INDIGO_ENTRY_FROM={hhmm(entry_from)}\nINDIGO_ENTRY_TO={hhmm(entry_to)}\n'
                      f'INDIGO_EXIT_FROM={hhmm(exit_from)}\nINDIGO_EXIT_TO={hhmm(exit_to)}\n'
                      f'INDIGO_STEP_MINUTES={step}\nINDIGO_PARKING_MODE={"t3_covered" if mode == "t3" else "all"}\n'
                  )

          if parking_only:
              print(f'Busca Indigo GRU: {start_date} {hhmm(entry_from)}–{hhmm(entry_to)} → {end_date} {hhmm(exit_from)}–{hhmm(exit_to)}, passo {step} min, modo={mode}, id={request_id}')
          else:
              periodo = month if period_mode == 'month' else f'{start_date} → {end_date}'
              print(f'Busca solicitada: {origin}->{dest}, {periodo}, até {stops} escalas, id={request_id}')
          PY

      - name: Cancelamento confirmado
        if: env.SEARCH_CANCEL_ONLY == '1'
        run: echo "Pesquisa anterior cancelada pelo painel."

      - name: Python
        if: env.SEARCH_CANCEL_ONLY != '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            flight-explorer/requirements.txt
            indigo-parking/requirements.txt

      - name: Dependências de passagens
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        run: python -m pip install -r flight-explorer/requirements.txt

      - name: Dependências do estacionamento
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        run: |
          python -m pip install -r indigo-parking/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validar código de passagens
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        run: |
          python -m py_compile flight-month-search/search.py flight-month-search/multisource.py flight-month-search/swoop_batch_worker.py
          node --check docs/flight-explorer.js

      - name: Validar código do estacionamento
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        run: |
          python -m py_compile indigo-parking/search.py
          node --check docs/indigo-parking.js

      - name: Pesquisar período em múltiplas fontes
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        env:
          PYTHONPATH: flight-monitor:.
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_LIVE_BRANCH: flight-live
          SEARCH_MULTI_WORKERS: "10"
        run: python flight-month-search/multisource.py

      - name: Pesquisar estacionamento Indigo GRU
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        env:
          INDIGO_OUTPUT_PATH: docs/data/indigo-parking.json
        run: python indigo-parking/search.py

      - name: Validar resultado de passagens
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-month-search.json').read_text(encoding='utf-8'))
          assert d.get('version')=='0.4.0'
          assert d.get('mode') in {'full_month_matrix','date_range_matrix'}
          assert d.get('status')=='completed'
          assert d.get('currency')=='BRL'
          assert d.get('source_strategy')=='preflight_sharded'
          assert isinstance(d.get('source_health'), dict)
          assert 'google' in (d.get('active_sources') or [])
          assert int(d['stats']['combinations']) > 0
          assert len(d.get('results',[])) <= 100
          assert d.get('request_id')
          r=d['request']
          for row in d.get('results',[]):
              assert float(row['price']) > 0
              assert row['departure_date'] < row['return_date']
              assert r['start_date'] <= row['departure_date'] <= r['end_date']
              assert r['start_date'] <= row['return_date'] <= r['end_date']
              assert row.get('currency','BRL') == 'BRL'
          print('Busca multifonte válida:', d['request_id'], r, d['stats'], d.get('active_sources'), d.get('source_counts'))
          PY

      - name: Validar resultado do estacionamento
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('docs/data/indigo-parking.json').read_text(encoding='utf-8'))
          assert d.get('version') == '0.1.0'
          assert d.get('status') == 'completed'
          assert d.get('request_id') == os.environ['SEARCH_REQUEST_ID']
          assert d.get('request',{}).get('airport') == 'GRU'
          assert int(d.get('stats',{}).get('combinations',0)) > 0
          assert int(d.get('stats',{}).get('combinations',0)) <= 48
          assert isinstance(d.get('results'), list)
          assert isinstance(d.get('checks'), list)
          print('Busca Indigo válida:', d['request_id'], d['stats'])
          PY

      - name: Persistir resultado e histórico
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        run: |
          git config user.name "flight-month-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/flight-month-search.json docs/data/flight-price-history.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: salvar busca multifonte de passagens [skip ci]"
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Conflito temporário ao salvar; tentativa $tentativa/3"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
          fi

      - name: Persistir resultado do estacionamento
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        run: |
          git config user.name "indigo-parking-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/indigo-parking.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: salvar disponibilidade Indigo GRU [skip ci]"
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Conflito temporário ao salvar; tentativa $tentativa/3"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
          fi

      - name: Resumo de passagens
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY != '1'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-month-search.json').read_text(encoding='utf-8'))
          r=d['request']; s=d['stats']; h=d.get('history_summary') or {}; sources=d.get('source_counts') or {}
          periodo = r['month'] if r.get('period_mode') == 'month' else f"{r['start_date']} → {r['end_date']}"
          source_text = ', '.join(f'{k}:{v}' for k,v in sources.items() if v) or '-'
          active_text = ', '.join(d.get('active_sources') or [])
          lines=[
              '## Busca de passagens sob demanda · multifonte',
              f"- ID: {d.get('request_id')}",
              f"- Rota: {r['origin']} → {r['destination']}",
              f"- Período: {periodo}",
              f"- Moeda: BRL (R$)",
              f"- Fontes aprovadas no pré-teste: {active_text}",
              f"- Combinações: {s['combinations']}",
              f"- Com preço: {s['priced_combinations']} ({s['coverage_pct']}%)",
              f"- Distribuição por fonte: {source_text}",
              f"- Top exibido: {s['result_count']}/100",
              f"- Menor preço: R$ {s['lowest_price'] if s['lowest_price'] is not None else '-'}",
              f"- Comparadas ao histórico: {h.get('compared',0)} · baixaram {h.get('cheaper',0)} · subiram {h.get('higher',0)}",
              '- Cada fonte externa é testada uma vez para a rota. Só as que retornam tarifa BRL confiável recebem datas.',
              '- Fontes bloqueadas/dinâmicas ficam como links de pesquisa e não atrasam centenas de combinações.',
              '- Durante a execução, achados parciais são salvos na branch flight-live.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n'.join(lines)+'\n')
          PY

      - name: Resumo do estacionamento
        if: env.SEARCH_CANCEL_ONLY != '1' && env.SEARCH_PARKING_ONLY == '1'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('docs/data/indigo-parking.json').read_text(encoding='utf-8'))
          r=d['request']; s=d['stats']
          lines=[
              '## Indigo Neo · Estacionamento GRU',
              f"- ID: {d.get('request_id')}",
              f"- Entrada: {r['entry_date']} · {r['entry_from']}–{r['entry_to']}",
              f"- Saída: {r['exit_date']} · {r['exit_from']}–{r['exit_to']}",
              f"- Intervalo: {r['step_minutes']} min",
              f"- Modo: {r['parking_mode']}",
              f"- Combinações: {s['combinations']}",
              f"- Testadas: {s['tested']}",
              f"- Com vaga: {s['available_combinations']}",
              f"- Erros: {s['errors']}",
              '- A automação apenas consulta disponibilidade; não efetua reserva nem pagamento.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n'.join(lines)+'\n')
          PY
