name: Busca de passagens sob demanda
run-name: "Busca ${{ inputs.request_id }} · ${{ inputs.origin }} → ${{ inputs.destination }} · ${{ inputs.month }}"

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origem (IATA ou código interno de intervalo)"
        required: true
        default: "GRU"
        type: string
      destination:
        description: "Destino (IATA)"
        required: true
        default: "MIA"
        type: string
      month:
        description: "Mês pesquisado (YYYY-MM)"
        required: true
        default: "2026-10"
        type: string
      max_stops:
        description: "Máximo de escalas"
        required: true
        default: "2"
        type: choice
        options: ["0", "1", "2"]
      request_id:
        description: "ID da solicitação do Pages/Apps Script"
        required: false
        default: "manual"
        type: string

concurrency:
  group: flight-search-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar solicitação
        env:
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_STOPS: ${{ inputs.max_stops }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import os, re
          origin=os.environ['INPUT_ORIGIN'].strip().upper()
          dest=os.environ['INPUT_DESTINATION'].strip().upper()
          month=os.environ['INPUT_MONTH'].strip()
          stops=int(os.environ['INPUT_STOPS'])
          request_id=(os.environ.get('INPUT_REQUEST_ID') or 'manual').strip()[:80]

          cancel_only = origin == 'QZZ' and dest == 'QZX'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"SEARCH_CANCEL_ONLY={'1' if cancel_only else '0'}\n")
          if cancel_only:
              print('Cancelamento solicitado pelo painel. A execução anterior foi encerrada pelo concurrency.')
              raise SystemExit(0)

          if not re.fullmatch(r'[A-Z]{3}',origin) or not re.fullmatch(r'[A-Z]{3}',dest): raise SystemExit('IATA/código interno inválido')
          if not re.fullmatch(r'20\d\d-(0[1-9]|1[0-2])',month): raise SystemExit('Mês inválido')
          if stops not in (0,1,2): raise SystemExit('Escalas inválidas')
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,80}',request_id): raise SystemExit('request_id inválido')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'SEARCH_ORIGIN={origin}\nSEARCH_DESTINATION={dest}\nSEARCH_MONTH={month}\nSEARCH_MAX_STOPS={stops}\nSEARCH_REQUEST_ID={request_id}\n')
          print(f'Busca solicitada: {origin}->{dest}, {month}, até {stops} escalas, id={request_id}')
          PY

      - name: Cancelamento confirmado
        if: env.SEARCH_CANCEL_ONLY == '1'
        run: echo "Pesquisa anterior cancelada pelo painel."

      - name: Python
        if: env.SEARCH_CANCEL_ONLY != '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight-explorer/requirements.txt

      - name: Dependências
        if: env.SEARCH_CANCEL_ONLY != '1'
        run: python -m pip install -r flight-explorer/requirements.txt

      - name: Validar código
        if: env.SEARCH_CANCEL_ONLY != '1'
        run: |
          python -m py_compile flight-month-search/search.py flight-month-search/swoop_batch_worker.py
          node --check docs/flight-explorer.js

      - name: Pesquisar matriz completa do período
        if: env.SEARCH_CANCEL_ONLY != '1'
        env:
          PYTHONPATH: flight-monitor:.
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_LIVE_BRANCH: flight-live
        run: python flight-month-search/search.py

      - name: Validar resultado
        if: env.SEARCH_CANCEL_ONLY != '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-month-search.json').read_text(encoding='utf-8'))
          assert d.get('version')=='0.4.0'
          assert d.get('mode') in {'full_month_matrix','date_range_matrix'}
          assert d.get('status')=='completed'
          assert int(d['stats']['combinations']) > 0
          assert len(d.get('results',[])) <= 100
          assert d.get('request_id')
          r=d['request']
          for row in d.get('results',[]):
              assert float(row['price']) > 0
              assert row['departure_date'] < row['return_date']
              assert r['start_date'] <= row['departure_date'] <= r['end_date']
              assert r['start_date'] <= row['return_date'] <= r['end_date']
          print('Busca válida:', d['request_id'], r, d['stats'])
          PY

      - name: Persistir resultado e histórico
        if: env.SEARCH_CANCEL_ONLY != '1'
        run: |
          git config user.name "flight-month-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/flight-month-search.json docs/data/flight-price-history.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: salvar busca e histórico de passagens [skip ci]"
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Conflito temporário ao salvar; tentativa $tentativa/3"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
          fi

      - name: Resumo
        if: env.SEARCH_CANCEL_ONLY != '1'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-month-search.json').read_text(encoding='utf-8'))
          r=d['request']; s=d['stats']; h=d.get('history_summary') or {}
          periodo = r['month'] if r.get('period_mode') == 'month' else f"{r['start_date']} → {r['end_date']}"
          lines=[
              '## Busca de passagens sob demanda',
              f"- ID: {d.get('request_id')}",
              f"- Rota: {r['origin']} → {r['destination']}",
              f"- Período: {periodo}",
              f"- Combinações: {s['combinations']}",
              f"- Com preço: {s['priced_combinations']} ({s['coverage_pct']}%)",
              f"- Top exibido: {s['result_count']}/100",
              f"- Menor preço: R$ {s['lowest_price'] if s['lowest_price'] is not None else '-'}",
              f"- Comparadas ao histórico: {h.get('compared',0)} · baixaram {h.get('cheaper',0)} · subiram {h.get('higher',0)}",
              '- Durante a execução, achados parciais foram salvos na branch flight-live.'
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n'.join(lines)+'\n')
          PY
