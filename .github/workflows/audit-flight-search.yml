name: Auditoria isolada de passagens
on:
  push:
    branches: [audit/flight-search-20260912]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r flight-explorer/requirements.txt
      - name: Regressões Python
        run: python tests/test_flight_search.py
      - name: Testes existentes
        run: node --test tests/flight-search.test.cjs
      - name: Navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/flight-browser.cjs
