name: Acompanhamento pessoal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "price-monitor/config.json"
      - "price-monitor/src/**"
      - "price-monitor/tests/**"
      - ".github/workflows/price-monitor.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: personal-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: price-monitor/requirements.txt

      - name: Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Dependências
        run: python -m pip install -r price-monitor/requirements.txt

      - name: Testes
        env:
          PYTHONPATH: price-monitor/src
        run: python -m pytest -q price-monitor/tests

      - name: Atualização
        env:
          PYTHONPATH: price-monitor/src
        run: |
          python -m price_monitor.run \
            --config price-monitor/config.json \
            --output docs/data/current.json \
            --history price-monitor/data/history.json
          cp docs/data/current.json price-monitor/site/data/current.json

      - name: Persistir dados
        run: |
          git config user.name "personal-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-monitor/data/history.json price-monitor/site/data/current.json docs/data/current.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar acompanhamento pessoal [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Resumo
        run: |
          python - <<'PY'
          import json, os
          with open('docs/data/current.json', encoding='utf-8') as f:
              d = json.load(f)
          lines = [
              '## Acompanhamento pessoal',
              f"- Itens observados: {d.get('observed_count', 0)}",
              f"- Produtos listados: {d.get('product_count', 0)}",
              f"- Itens em vistoria encontrados: {d.get('tracked_count', 0)}",
              f"- Destaques confirmados: {d.get('active_count', 0)}",
              f"- Atualizado: {d.get('generated_at', '-')}",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY
