name: Monitor de preços oficiais

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "price-monitor/**"
      - ".github/workflows/price-monitor.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: price-monitor/requirements.txt

      - name: Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Dependências
        run: pip install -r price-monitor/requirements.txt

      - name: Testes
        env:
          PYTHONPATH: price-monitor/src
        run: pytest -q price-monitor/tests

      - name: Varredura
        env:
          PYTHONPATH: price-monitor/src
        run: |
          python -m price_monitor.run \
            --config price-monitor/config.json \
            --output price-monitor/site/data/current.json \
            --history price-monitor/data/history.json

      - name: Persistir histórico e resultado
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-monitor/data/history.json price-monitor/site/data/current.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar monitor de preços"
            git push
          fi

      - name: Configurar Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Empacotar site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: price-monitor/site

      - name: Publicar site
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
