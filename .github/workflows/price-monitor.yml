name: Monitor de preços oficiais

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: price-monitor/requirements.txt

      - name: Dependências
        run: python -m pip install -r price-monitor/requirements.txt

      - name: Testes
        env:
          PYTHONPATH: price-monitor/src
        run: python -m pytest -q price-monitor/tests

      - name: Varredura
        env:
          PYTHONPATH: price-monitor/src
        run: python -m price_monitor.run --config price-monitor/config.json --output price-monitor/site/data/current.json --history price-monitor/data/history.json

      - name: Persistir histórico e resultado
        shell: pwsh
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-monitor/data/history.json price-monitor/site/data/current.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "data: atualizar monitor de preços [skip ci]"
            git pull --rebase origin main
            git push origin main
          } else {
            Write-Host "Nenhuma alteração para salvar."
          }

      - name: Resumo
        shell: pwsh
        run: |
          $d = Get-Content price-monitor/site/data/current.json -Raw | ConvertFrom-Json
          "## Monitor de preços" >> $env:GITHUB_STEP_SUMMARY
          "- Ofertas oficiais observadas: $($d.observed_count)" >> $env:GITHUB_STEP_SUMMARY
          "- Possíveis bugs ativos: $($d.active_count)" >> $env:GITHUB_STEP_SUMMARY
          "- Atualizado: $($d.generated_at)" >> $env:GITHUB_STEP_SUMMARY
