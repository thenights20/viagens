name: Indigo GRU availability search
run-name: "Indigo ${{ inputs.request_id || 'manual' }} · ${{ inputs.entry_date_from || '2026-09-15' }}..${{ inputs.entry_date_to || inputs.entry_date_from || '2026-09-15' }} → ${{ inputs.exit_date_from || '2026-10-06' }}..${{ inputs.exit_date_to || inputs.exit_date_from || '2026-10-06' }}"

on:
  workflow_dispatch:
    inputs:
      entry_date_from:
        description: "Entrada: data inicial (YYYY-MM-DD)"
        required: true
        default: "2026-09-15"
        type: string
      entry_date_to:
        description: "Entrada: data final (YYYY-MM-DD)"
        required: true
        default: "2026-09-15"
        type: string
      exit_date_from:
        description: "Saída: data inicial (YYYY-MM-DD)"
        required: true
        default: "2026-10-06"
        type: string
      exit_date_to:
        description: "Saída: data final (YYYY-MM-DD)"
        required: true
        default: "2026-10-06"
        type: string
      entry_from_time:
        description: "Entrada a partir de"
        required: true
        default: "12:00"
        type: string
      entry_to_time:
        description: "Entrada até"
        required: true
        default: "15:00"
        type: string
      exit_from_time:
        description: "Saída a partir de"
        required: true
        default: "06:00"
        type: string
      exit_to_time:
        description: "Saída até"
        required: true
        default: "09:00"
        type: string
      step_minutes:
        description: "Intervalo entre horários"
        required: true
        default: "30"
        type: choice
        options: ["30", "60"]
      product:
        description: "Produto"
        required: true
        default: "terminal3_garage"
        type: choice
        options: ["terminal3_garage", "terminal3_flex", "terminal2_standard", "terminal1", "any"]
      request_id:
        description: "ID da solicitação"
        required: false
        default: "manual"
        type: string
  push:
    branches: [main]
    paths:
      - 'parking-indigo/**'
      - '.github/workflows/indigo-parking-search.yml'

permissions:
  contents: write

concurrency:
  group: indigo-gru-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dependências
        run: npm install --no-save playwright-core@1.55.0

      - name: Validar motor
        run: node --check parking-indigo/search.mjs

      - name: Consultar disponibilidade Indigo
        env:
          CHROME_PATH: /usr/bin/google-chrome
          INDIGO_ENTRY_DATE_FROM: ${{ inputs.entry_date_from || '2026-09-15' }}
          INDIGO_ENTRY_DATE_TO: ${{ inputs.entry_date_to || inputs.entry_date_from || '2026-09-15' }}
          INDIGO_EXIT_DATE_FROM: ${{ inputs.exit_date_from || '2026-10-06' }}
          INDIGO_EXIT_DATE_TO: ${{ inputs.exit_date_to || inputs.exit_date_from || '2026-10-06' }}
          INDIGO_ENTRY_FROM_TIME: ${{ inputs.entry_from_time || '12:00' }}
          INDIGO_ENTRY_TO_TIME: ${{ inputs.entry_to_time || '15:00' }}
          INDIGO_EXIT_FROM_TIME: ${{ inputs.exit_from_time || '06:00' }}
          INDIGO_EXIT_TO_TIME: ${{ inputs.exit_to_time || '09:00' }}
          INDIGO_STEP_MINUTES: ${{ inputs.step_minutes || '30' }}
          INDIGO_PRODUCT: ${{ inputs.product || 'terminal3_garage' }}
          INDIGO_REQUEST_ID: ${{ inputs.request_id || 'manual' }}
        run: node parking-indigo/search.mjs

      - name: Validar resultado
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/data/indigo-parking-search.json','utf8'));
          if(d.status!=='completed') throw new Error(d.error||'Pesquisa Indigo não concluída');
          if(!Array.isArray(d.results)||!d.results.length) throw new Error('Nenhuma combinação foi testada');
          if(!d.results.every(x=>x.entry_date && x.exit_date && x.entry_time && x.exit_time && ['available','sold_out','not_offered','unstable','error'].includes(x.status))) throw new Error('Resultado inválido');
          const greens=d.results.filter(x=>x.available===true);
          if(!greens.every(x=>x.confirmed===true && x.verification?.attempts>=3 && Number(x.price)>0)) throw new Error('Disponibilidade verde sem confirmação suficiente');
          console.log(`Indigo: ${d.stats.available_combinations}/${d.stats.tested_combinations} combinações confirmadas; ${d.stats.entry_days||1} dia(s) de entrada × ${d.stats.exit_days||1} dia(s) de saída`);
          if(d.best_combination) console.log('Melhor confirmada:',d.best_combination);
          NODE

      - name: Publicar resultado no painel
        run: |
          git config user.name "indigo-parking-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/indigo-parking-search.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "data: atualizar disponibilidade Indigo GRU [skip ci]"
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Tentativa $tentativa/3 para publicar resultado"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
          fi
