name: Worldwide airport autocomplete migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/airport-autocomplete-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate worldwide airports and patch UI
        run: python tools/airport_autocomplete_migration.py

      - name: Validate JavaScript
        run: |
          node --check docs/flight-explorer.js
          node --check docs/terabyte-live.js

      - name: Commit changes
        run: |
          git config user.name "airport-autocomplete-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js docs/terabyte-live.js docs/index.html docs/data/airports-world.json
          git commit -m "feat: worldwide destination airport autocomplete [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
