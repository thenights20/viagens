name: Busca flexível 100 destinos

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origem para antecipar a busca (auto = próxima da rotação)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - DOU
          - PMG
          - JTC
          - GRU
          - CGH
          - VCP
          - GIG
          - TJL
          - ARU
          - PPB
          - MII
  push:
    branches: [main, feat/flight-explorer-100]
    paths:
      - "flight-explorer/**"
      - "docs/flight-explorer.js"
      - "docs/terabyte-live.js"
      - ".github/workflows/flight-explorer.yml"
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: flight-explorer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight-explorer/requirements.txt

      - name: Dependências
        run: python -m pip install -r flight-explorer/requirements.txt

      - name: Validar código e catálogo
        run: |
          python -m py_compile flight-explorer/scan.py
          node --check docs/flight-explorer.js
          node --check docs/terabyte-live.js
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('flight-explorer/catalog.json').read_text(encoding='utf-8'))
          rows=c.get('destinations',[])
          assert len(rows)==100, len(rows)
          assert len({x['code'] for x in rows})==100
          assert sum(x['scope']=='domestic' for x in rows)==50
          assert sum(x['scope']=='international' for x in rows)==50
          print('Catálogo válido: 50 nacionais + 50 internacionais.')
          PY

      - name: Buscar passagens até 6 meses
        env:
          PYTHONPATH: flight-monitor:.
          EXPLORER_ORIGIN: ${{ github.ref_name == 'feat/flight-explorer-100' && 'DOU' || (github.event.inputs.origin != 'auto' && github.event.inputs.origin || '') }}
        run: python flight-explorer/scan.py

      - name: Validar feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-explorer.json').read_text(encoding='utf-8'))
          assert d.get('version')=='0.1.0'
          assert d.get('catalog_count')==100
          assert d.get('horizon_days')==183
          assert len(d.get('origins',[]))>=11
          for row in d.get('results',[]):
              assert row['scope'] in ('domestic','international')
              assert float(row['price'])>0
              assert 1 <= int(row.get('rank',1)) <= 100
          print('Feed da busca flexível válido.')
          PY

      - name: Persistir dados
        run: |
          git config user.name "flight-explorer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-explorer/data/state.json docs/data/flight-explorer.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar busca flexível de passagens [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Resumo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('docs/data/flight-explorer.json').read_text(encoding='utf-8'))
          s=d.get('scan',{})
          c=d.get('coverage',{}).get(s.get('origin',''),{})
          lines=[
            '## Busca flexível · 100 destinos',
            f"- Origem: {s.get('origin','-')} · {s.get('origin_name','-')}",
            f"- Janela: {s.get('phase','-')}/6 · {s.get('departure_date','-')} → {s.get('return_date','-')}",
            f"- Consultas dirigidas: {s.get('directed_queries',0)}",
            f"- Resultados fast-flights: {s.get('fast_results',0)}",
            f"- Fallback Swoop: {s.get('fallback_results',0)}/{s.get('fallback_attempts',0)}",
            f"- Resultados flexíveis Swoop: {s.get('discovery_results',0)}",
            f"- Nacionais disponíveis: {c.get('domestic',{}).get('options',0)}/100",
            f"- Internacionais disponíveis: {c.get('international',{}).get('options',0)}/100",
            f"- Erros resumidos: {s.get('errors',0)}",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
