name: Apply Apple history UI once

on:
  push:
    paths:
      - '.github/workflows/apple-history-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          git apply --check tools/apple-history.patch
          git apply tools/apple-history.patch
          node --check docs/apple-stock.js
      - name: Commit change
        run: |
          git config user.name "personal-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apple-stock.js
          git commit -m "ui: add Apple stock history timeline and compact layout"
          git push
