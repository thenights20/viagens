name: Compact Apple embedded UI
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('docs/apple-stock.js')
          s=p.read_text(encoding='utf-8')
          old="""    .apple-regional-window .apple-head{position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0;margin:0 0 6px}
    .apple-regional-window .apple-head .sub{display:none}
    .apple-regional-window .apple-head h2{font-size:17px;margin:0}"""
          new="""    .apple-regional-window .apple-head{display:none!important}
    .apple-regional-window header,.apple-regional-window .hero,.apple-regional-window .page-head{display:none!important}
    .apple-regional-window #appleStockApp{padding-top:4px!important;margin-top:0!important}"""
          if old not in s: raise SystemExit('regional header CSS target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/apple-stock.js
          git commit -m 'fix: remove redundant headings from embedded Apple columns'
          git push
