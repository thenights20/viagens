name: Fix Apple Embedded Header Once
on:
  push:
    paths:
      - '.github/workflows/fix-apple-embed-header-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix embedded header selector
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/apple-stock.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.apple-regional-window body>.wrap>header{display:none!important}', 'body.apple-regional-window>.wrap>header{display:none!important}')
          marker='    .apple-regional-window #appleStockApp{padding-top:0!important;margin-top:0!important}'
          extra='    body.apple-regional-window>.wrap{padding-top:4px!important}\n'
          if extra.strip() not in s and marker in s:
              s=s.replace(marker, extra+marker, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/apple-stock.js
          git commit -m 'fix: remove redundant offers header from embedded Apple monitors'
          git push
