name: Apple stock monitor smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-stock-smoke.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Validate Apple monitor JavaScript
        run: node --check docs/apple-stock.js
      - name: Validate Apple Apps Script source
        run: |
          cat apps-script/*.gs > /tmp/apple-service.js
          node --check /tmp/apple-service.js
          grep -q "api/apple/availability" apps-script/Code.gs
          grep -q "MJW64LL/A" apps-script/Apple.gs
