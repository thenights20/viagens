name: Monitor de passagens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flight-monitor/**"
      - "search_core.py"
      - "airport_catalog.py"
      - ".github/workflows/flight-monitor.yml"
  schedule:
    - cron: "37 * * * *"

concurrency:
  group: flight-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight-monitor/requirements.txt

      - name: Dependências
        run: python -m pip install -r flight-monitor/requirements.txt

      - name: Varredura de passagens
        env:
          PYTHONPATH: .
        run: python flight-monitor/scan.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['flight-monitor/data/state.json', 'docs/data/flights.json']:
              data = json.loads(Path(name).read_text(encoding='utf-8'))
              assert isinstance(data, dict)
          print('JSON válido.')
          PY

      - name: Persistir dados
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-monitor/data/state.json docs/data/flights.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar deals de passagens [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Resumo
        run: |
          python - <<'PY'
          import json, os
          with open('docs/data/flights.json', encoding='utf-8') as f:
              d = json.load(f)
          scan = d.get('scan', {})
          lines = [
              '## Monitor de passagens',
              f"- Origens nesta rodada: {', '.join(scan.get('origin_codes', [])) or '-'}",
              f"- Destinos nesta rodada: {len(scan.get('destination_codes', []))}",
              f"- Consultas: {scan.get('queries', 0)}",
              f"- Resultados: {scan.get('results', 0)}",
              f"- Rotas com histórico: {d.get('route_count', 0)}",
              f"- Deals exibidos: {d.get('deal_count', 0)}",
              f"- Erros: {scan.get('errors', 0)}",
              f"- Atualizado: {d.get('generated_at', '-')}"
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY
