name: Monitor de passagens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flight-monitor/**"
      - "search_core.py"
      - "airport_catalog.py"
      - ".github/workflows/flight-monitor.yml"
  schedule:
    - cron: "37 * * * *"

concurrency:
  group: flight-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight-monitor/requirements.txt

      - name: Dependências
        run: python -m pip install -r flight-monitor/requirements.txt

      - name: Testes do radar
        env:
          PYTHONPATH: flight-monitor:.
        run: python -m unittest discover -s flight-monitor -p "test_*.py" -v

      - name: Varredura de passagens
        env:
          PYTHONPATH: flight-monitor:.
        run: python flight-monitor/scan.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('flight-monitor/data/state.json').read_text(encoding='utf-8'))
          data = json.loads(Path('docs/data/flights.json').read_text(encoding='utf-8'))
          assert isinstance(state, dict) and isinstance(data, dict)
          assert data.get('version') == '0.2.0'
          assert data.get('origin_count', 0) >= 11
          for row in data.get('deals', []):
              assert 0 <= int(row.get('deal_score', 0)) <= 100
          print('JSON e Deal Score válidos.')
          PY

      - name: Persistir dados
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-monitor/data/state.json docs/data/flights.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "data: atualizar radar de passagens [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Resumo
        run: |
          python - <<'PY'
          import json, os
          with open('docs/data/flights.json', encoding='utf-8') as f:
              d = json.load(f)
          scan = d.get('scan', {})
          lines = [
              '## Radar de passagens',
              f"- Origens nesta rodada: {', '.join(scan.get('origin_codes', [])) or '-'}",
              f"- Perfil de datas: {scan.get('date_profile', '-')} ",
              f"- Destinos fixos nesta rodada: {len(scan.get('destination_codes', []))}",
              f"- Consultas dirigidas: {scan.get('queries', 0)}",
              f"- Resultados discovery: {scan.get('discovery_results', 0)}",
              f"- Fallbacks usados: {scan.get('fallback_results', 0)}",
              f"- Revalidados: {scan.get('revalidated', 0)}",
              f"- Rotas com histórico: {d.get('route_count', 0)}",
              f"- Deals 70+: {d.get('strong_deal_count', 0)}",
              f"- Novos alertas: {d.get('new_alert_count', 0)}",
              f"- Erros: {scan.get('errors', 0)}",
              f"- Atualizado: {d.get('generated_at', '-')}"
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY
