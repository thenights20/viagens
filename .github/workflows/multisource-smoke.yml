name: Multisource smoke check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multisource-smoke.yml'
      - 'flight-month-search/multisource.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flight-explorer/requirements.txt
      - name: Dependencies
        run: python -m pip install -r flight-explorer/requirements.txt
      - name: Compile and unit smoke
        env:
          PYTHONPATH: flight-monitor:flight-month-search:.
        run: |
          python -m py_compile flight-month-search/search.py flight-month-search/multisource.py flight-month-search/swoop_batch_worker.py
          python - <<'PY'
          import multisource as m
          assert m.extract_brl_prices('Tarifa R$ 1.234,56') == [1234.56]
          links=m.search_links('GRU','MIA','2026-10-15','2026-10-18')
          assert set(m.SOURCE_CATALOG).issubset(links)
          print('unit smoke ok')
          PY
      - name: Diagnose public meta-search pages
        env:
          PYTHONPATH: flight-monitor:flight-month-search:.
        run: |
          python - <<'PY'
          import re, requests
          import multisource as m
          O,D,DEP,RET='GRU','MIA','2026-10-15','2026-10-18'
          for source in ['kayak','momondo']:
              url=m.URL_BUILDERS[source](O,D,DEP,RET)
              r=requests.get(url,timeout=16,allow_redirects=True,headers={'User-Agent':m.USER_AGENT,'Accept-Language':'pt-BR,pt;q=0.9,en;q=0.7'})
              body=r.text
              print('\nSOURCE',source,'status',r.status_code,'final',r.url,'len',len(body))
              print('prices',m.extract_brl_prices(body)[:30])
              shown=0
              for hit in re.finditer(r'R\$\s*[0-9][0-9.,]*',body,re.I):
                  ctx=re.sub(r'\s+',' ',body[max(0,hit.start()-180):hit.end()+220])
                  print('CTX',ctx[:500])
                  shown += 1
                  if shown>=12: break
          PY
