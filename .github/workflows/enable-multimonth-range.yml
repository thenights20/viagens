name: Habilitar intervalo entre meses

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enable_multimonth_range.py'
      - '.github/workflows/enable-multimonth-range.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar suporte multi-mês
        run: python scripts/enable_multimonth_range.py

      - name: Validar código
        run: |
          python -m py_compile flight-month-search/search.py flight-month-search/swoop_batch_worker.py
          node --check docs/flight-explorer.js
          node --test tests/flight-search.test.cjs
          grep -q 'v0.6.1' docs/flight-explorer.js
          grep -q 'SEARCH_PERIOD_MODE' flight-month-search/search.py
          grep -q "start_date:request.start_date" docs/flight-explorer.js
          ! grep -q 'O intervalo precisa ficar dentro do mesmo mês' docs/flight-explorer.js

      - name: Salvar implementação
        run: |
          git config user.name "flight-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/flight-explorer.js flight-month-search/search.py tests/flight-search.test.cjs
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "feat: permitir pesquisa por intervalo entre meses [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
